<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escáner QR de Asistencia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Librería para escanear códigos QR -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 390px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    h2 {
      margin-top: 0;
      color: #222;
    }

    p {
      font-size: 15px;
      color: #333;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    .msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background-color: #e9f5ff;
      font-size: 14px;
      color: #222;
      word-wrap: break-word;
    }

    button {
      width: 90%;
      padding: 12px;
      margin-top: 15px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Escáner QR</h2>

    <p>Apunta la cámara al código QR de asistencia.</p>

    <button id="btnCamara" onclick="iniciarEscaner()">Activar cámara</button>

    <div id="reader"></div>

    <div class="msg" id="mensaje">
      Esperando activación de cámara...
    </div>
  </div>

  <script>
    // URL de la Web App de Apps Script
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1BfKHYex1_oiukvzOnZbdnP78apCFZkgKTSDQxJINvgq0TZSeUrwIa6cQglVa5GhZCg/exec";

    let scannerActivo = false;
    let html5QrCode = null;

    function mostrarMensaje(texto) {
      document.getElementById("mensaje").innerHTML = texto;
    }

    function extraerCodigo(textoQR) {
      try {
        const url = new URL(textoQR);
        const codigo = url.searchParams.get("codigo");

        if (codigo) {
          return codigo;
        }

        return textoQR;
      } catch (error) {
        return textoQR;
      }
    }

    async function obtenerIP() {
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        return data.ip;
      } catch (error) {
        return "NO_IP";
      }
    }

    async function iniciarEscaner() {
      const boton = document.getElementById("btnCamara");

      if (scannerActivo) {
        mostrarMensaje("⚠️ La cámara ya está activa.");
        return;
      }

      if (typeof Html5Qrcode === "undefined") {
        mostrarMensaje("❌ No cargó la librería html5-qrcode. Revisa tu conexión o recarga la página.");
        return;
      }

      try {
        boton.disabled = true;
        boton.innerText = "Activando cámara...";
        mostrarMensaje("📷 Solicitando permiso de cámara...");

        html5QrCode = new Html5Qrcode("reader");

        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          mostrarMensaje("❌ No se detectó ninguna cámara en este dispositivo.");
          boton.disabled = false;
          boton.innerText = "Activar cámara";
          return;
        }

        let cameraId = cameras[0].id;

        for (let i = 0; i < cameras.length; i++) {
          const label = cameras[i].label.toLowerCase();

          if (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment") ||
            label.includes("trasera")
          ) {
            cameraId = cameras[i].id;
            break;
          }
        }

        const config = {
          fps: 10,
          qrbox: {
            width: 230,
            height: 230
          }
        };

        await html5QrCode.start(
          cameraId,
          config,
          async function(decodedText) {
            const codigo = extraerCodigo(decodedText);

            mostrarMensaje(
              "✅ QR detectado. Código: " + codigo + "<br>Registrando asistencia..."
            );

            try {
              await html5QrCode.stop();
            } catch (e) {}

            scannerActivo = false;

            const ip = await obtenerIP();

            const destino =
              APPS_SCRIPT_URL +
              "?action=registrar" +
              "&codigo=" + encodeURIComponent(codigo) +
              "&ip=" + encodeURIComponent(ip);

            window.location.href = destino;
          },
          function(errorMessage) {
            // No mostrar errores repetitivos mientras escanea.
          }
        );

        scannerActivo = true;
        boton.innerText = "Cámara activa";
        mostrarMensaje("📷 Cámara activa. Apunta al código QR.");

      } catch (error) {
        mostrarMensaje(
          "❌ No se pudo activar la cámara.<br><br>" +
          "<strong>Detalle:</strong> " + error.message + "<br><br>" +
          "Prueba desde Chrome en celular y acepta el permiso de cámara."
        );

        boton.disabled = false;
        boton.innerText = "Activar cámara";
        scannerActivo = false;
      }
    }
  </script>
</body>
</html>
