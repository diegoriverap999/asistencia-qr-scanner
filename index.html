<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escáner QR de Asistencia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Librería para escanear códigos QR -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 380px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    h2 {
      margin-top: 0;
      color: #222;
    }

    p {
      font-size: 15px;
      color: #333;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    .msg {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background-color: #e9f5ff;
      font-size: 14px;
      color: #222;
      word-wrap: break-word;
    }

    button {
      width: 90%;
      padding: 12px;
      margin-top: 15px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Escáner QR</h2>

    <p>Apunta la cámara al código QR de asistencia.</p>

    <button onclick="iniciarEscaner()">Activar cámara</button>

    <div id="reader"></div>

    <div class="msg" id="mensaje">
      Esperando activación de cámara...
    </div>
  </div>

  <script>
    // IMPORTANTE:
    // Pega aquí tu URL real de Apps Script terminada en /exec
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1BfKHYex1_oiukvzOnZbdnP78apCFZkgKTSDQxJINvgq0TZSeUrwIa6cQglVa5GhZCg/exec
";

    function extraerCodigo(textoQR) {
      try {
        const url = new URL(textoQR);
        const codigo = url.searchParams.get("codigo");

        if (codigo) {
          return codigo;
        }

        return textoQR;
      } catch (error) {
        return textoQR;
      }
    }

    async function obtenerIP() {
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        return data.ip;
      } catch (error) {
        return "NO_IP";
      }
    }

    async function iniciarEscaner() {
      const mensaje = document.getElementById("mensaje");

      mensaje.innerHTML = "📷 Activando cámara...";

      const html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 10,
        qrbox: {
          width: 230,
          height: 230
        }
      };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          async (decodedText) => {
            const codigo = extraerCodigo(decodedText);

            mensaje.innerHTML =
              "✅ QR detectado. Código: " + codigo + "<br>Registrando asistencia...";

            await html5QrCode.stop();

            const ip = await obtenerIP();

            const destino =
              APPS_SCRIPT_URL +
              "?action=registrar" +
              "&codigo=" + encodeURIComponent(codigo) +
              "&ip=" + encodeURIComponent(ip);

            window.location.href = destino;
          },
          (errorMessage) => {
            // No se muestra nada aquí para evitar mensajes repetidos mientras escanea.
          }
        );
      } catch (error) {
        mensaje.innerHTML =
          "❌ No se pudo activar la cámara. Revisa permisos del navegador.";
      }
    }
  </script>
</body>
</html>
